[pytest]
testpaths = tests
# -q keeps CI output to the failures. Warnings from FastAPI/pydantic internals are not
# actionable here; our own DeprecationWarnings still surface.
addopts = -q --strict-markers
filterwarnings =
    default
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:starlette.*
