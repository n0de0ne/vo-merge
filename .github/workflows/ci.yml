name: checks

# Nothing validated anything before: the only workflow built the image and pushed it, so a type
# error or a broken import shipped straight to GHCR — and to the Unraid box, which pulls
# claude/** branch builds. This runs on every push AND on pull requests, so a branch that does
# not match the publish filter still gets checked.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install media tools
        # The re-timing tests run the real mkvmerge and ffmpeg: the micro-skip bug lived in what
        # mkvmerge does with a --sync ratio, which no mock can reproduce. Without the tools those
        # tests skip, so install them rather than let CI pass on a skip.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mkvtoolnix ffmpeg
      - name: Install
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Byte-compile every module
        # catches a syntax error in a module the tests happen not to import
        run: python -m compileall -q backend/app
      - name: Tests
        working-directory: backend
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Type-check and build
        working-directory: frontend
        # `build` is `tsc --noEmit && vite build`: esbuild strips types without checking them,
        # so without the tsc step a type error builds and ships perfectly happily.
        run: npm run build
