name: build and publish image

on:
  push:
    # feature branches build too, so a branch can be pulled onto Unraid before it merges.
    # Only main publishes :latest (see is_default_branch below) — a branch build is tagged
    # with its own sanitised name, e.g. claude-ui-reliability-error-handling-48molg.
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Pinned to a literal owner ON PURPOSE. This used to be
          # ghcr.io/${{ github.repository_owner }}/vo-merge, which silently followed an account
          # rename: builds moved to the new path while the Unraid template kept pulling the old
          # one. GHCR does NOT redirect a renamed owner the way git repos do, so the old path
          # just starts answering "manifest unknown" and the server quietly runs a stale image.
          # If the account is ever renamed again, change this line and the Unraid template
          # together.
          images: ghcr.io/n0de0ne/vo-merge
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
